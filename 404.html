<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <title>Redirecting…</title>
  </head>
  <body>
    <p>Redirecting…</p>
    <script>
      // If meta refresh fails, do a JS redirect as fallback
      var path = window.location.pathname;
      // GitHub Pages serves 404.html on deep links; bounce to index.html preserving query/hash
      window.location.replace((path.endsWith('/') ? path : path.replace(/[^/]+$/, '')) + 'index.html' + window.location.search + window.location.hash);
    </script>
  </body>
</html>
